services:
  # Network A: Ground Segment
  ground-node-a:
    build:
      context: .
      dockerfile: docker/ground_node/Dockerfile
    container_name: ground-node-a
    volumes:
      - ./suchai-flight-software-v2:/suchai
      - ./libcsp-gs:/suchai/src/lib/libcsp
      - ground-build:/suchai/build
    networks:
      - ground-net
    stdin_open: true
    tty: true

  malicious-node:
    build:
      context: .
      dockerfile: docker/malicious_node/Dockerfile
    container_name: malicious-node
    depends_on:
      - ground-node-a
    volumes:
      - ./suchai-flight-software-v2:/suchai
      - ./libcsp-gs:/suchai/src/lib/libcsp
      - malicious-build:/suchai/build
    networks:
      - ground-net
    stdin_open: true
    tty: true

  # The Bridge: CSP Firewall
  firewall:
    build:
      context: ./docker/firewall
      dockerfile: Dockerfile
    container_name: firewall
    volumes:
      - ./docker/firewall:/app
    environment:
      - HUB_A_IP=ground-node-a
      - HUB_B_IP=sat-node-b
      - NODE_POLICY_ENABLED=${NODE_POLICY_ENABLED:-0}
    depends_on:
      - ground-node-a
      - sat-node-b
    networks:
      - ground-net
      - sat-net

  # Network B: Space Segment
  sat-node-b:
    build:
      context: .
      dockerfile: docker/sat_node/Dockerfile
    container_name: sat-node-b
    volumes:
      - ./suchai-flight-software-v2:/suchai
      - ./libcsp-gs:/suchai/src/lib/libcsp
      - sat-build:/suchai/build
    networks:
      - sat-net
    stdin_open: true
    tty: true

networks:
  ground-net:
    driver: bridge
  sat-net:
    driver: bridge

volumes:
  ground-build:
  malicious-build:
  sat-build:
